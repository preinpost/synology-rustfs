name: Build SPK

# Release tags are v<SPK_VERS>-<SPK_REV>, e.g. v1.0.4-3.
#
# - schedule: check daily for a new stable upstream RustFS release. A newer
#   version is applied with scripts/update-version.sh, committed to main by
#   github-actions[bot], built and released in the same run. Nothing happens
#   when the Release for the current tag already exists. Pushes made with
#   GITHUB_TOKEN do not trigger workflows, so the bot commit does not loop.
# - workflow_dispatch: build the version in the repository (e.g. after a
#   SPK_REV bump) and optionally publish its Release. An existing Release is
#   left alone unless force_rebuild is set; then the commit its tag points to
#   is rebuilt and the Release assets are replaced.
# - push of a v* tag: build that commit and publish its Release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the SPK files"
        type: boolean
        default: true
      force_rebuild:
        description: "Rebuild the tagged commit and replace the assets of an existing Release"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-spk
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # bot commit of the upstream update
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      build: ${{ steps.ver.outputs.build }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -eu
          current="$(sed -n 's/^PKG_VERS = //p' cross/rustfs/Makefile)"
          build=true
          release=true
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # the "latest" release excludes prereleases and drafts
            upstream="$(gh release view --repo rustfs/rustfs --json tagName --jq .tagName)"
            upstream="${upstream#v}"
            newest="$(printf '%s\n%s\n' "${current}" "${upstream}" | sort -V | tail -n1)"
            if [ "${upstream}" != "${current}" ] && [ "${newest}" = "${upstream}" ]; then
              echo "updating ${current} -> ${upstream}"
              ./scripts/update-version.sh "${upstream}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add cross spk
              git commit -m "rustfs ${upstream}-1: update to upstream ${upstream}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release="${INPUT_RELEASE}"
          fi
          vers="$(sed -n 's/^SPK_VERS = //p' spk/rustfs/Makefile)"
          rev="$(sed -n 's/^SPK_REV = //p' spk/rustfs/Makefile)"
          tag="v${vers}-${rev}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${tag} from spk/rustfs/Makefile" >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" != "push" ] \
            && gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_FORCE_REBUILD}" = "true" ]; then
              # rebuild what the tag points to, not whatever main is now
              sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
              echo "release ${tag} exists, rebuilding ${sha} and replacing its assets"
            elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "release ${tag} already exists, nothing to do"
              build=false
              release=false
            else
              echo "release ${tag} already exists, building without publishing (set force_rebuild to replace)"
              release=false
            fi
          fi
          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "build=${build}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag=${tag} build=${build} release=${release}"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/synocommunity/spksrc:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: true
      - name: Cache toolchains and distfiles
        uses: actions/cache@v6
        with:
          path: spksrc/distrib
          key: distrib-${{ matrix.arch }}-${{ needs.check.outputs.tag }}
          restore-keys: distrib-${{ matrix.arch }}-
      - name: Build
        env:
          NO_DOCKER: "1"
          ARCH: ${{ matrix.arch }}
        run: |
          git config --global --add safe.directory '*'
          ./scripts/build.sh "${ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: rustfs-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.spk > SHA256SUMS
          cat SHA256SUMS
      # Attest the exact files uploaded below; nothing touches dist/ in between.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.spk
            dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -eu
          cd dist
          vers="${TAG#v}"
          upstream="${vers%-*}"
          notes="RustFS ${upstream} SPK (package revision ${vers##*-}) for Synology DSM 7.1+ (x64, aarch64).

          Upstream release: https://github.com/rustfs/rustfs/releases/tag/${upstream}

          Unofficial, unsigned package. Verify the download with \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\` or \`sha256sum -c SHA256SUMS --ignore-missing\` and read the README before installing."
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber --repo "${GITHUB_REPOSITORY}" -- *.spk SHA256SUMS
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${SHA}" \
              --title "RustFS ${vers}" --notes "${notes}" -- *.spk SHA256SUMS
          fi
